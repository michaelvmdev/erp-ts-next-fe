<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">ERP MV DEV Logo</title>
  <desc id="desc">A modern ERP logo with connected modules and the ERP MV DEV wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="134" y1="112" x2="890" y2="912" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F766E"/>
      <stop offset="0.56" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="266" y1="240" x2="758" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#C7D2FE"/>
    </linearGradient>
    <filter id="shadow" x="80" y="80" width="864" height="864" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="96" y="96" width="832" height="832" rx="176" fill="url(#bg)" filter="url(#shadow)"/>

  <g opacity="0.16" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round">
    <path d="M254 318H770"/>
    <path d="M254 512H770"/>
    <path d="M254 706H770"/>
    <path d="M318 254V770"/>
    <path d="M512 254V770"/>
    <path d="M706 254V770"/>
  </g>

  <g fill="url(#accent)">
    <rect x="238" y="238" width="168" height="168" rx="40"/>
    <rect x="428" y="238" width="168" height="168" rx="40" opacity="0.92"/>
    <rect x="618" y="238" width="168" height="168" rx="40" opacity="0.82"/>
    <rect x="238" y="428" width="168" height="168" rx="40" opacity="0.9"/>
    <rect x="428" y="428" width="168" height="168" rx="40"/>
    <rect x="618" y="428" width="168" height="168" rx="40" opacity="0.9"/>
  </g>

  <g stroke="#FACC15" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M322 322H512V512H702"/>
    <path d="M512 322V702"/>
  </g>

  <g fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="512" y="696" font-size="142" font-weight="800" letter-spacing="0">ERP</text>
    <text x="512" y="782" font-size="56" font-weight="700" letter-spacing="8">MV DEV</text>
  </g>
